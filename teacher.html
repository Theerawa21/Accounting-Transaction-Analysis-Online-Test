<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123d72">
  <title>แดชบอร์ดครู | แบบทดสอบการวิเคราะห์รายการค้า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:"Sarabun",sans-serif;background:#eef6ff;color:#17324d}.page{min-height:100dvh;display:grid;grid-template-rows:auto 1fr}.topbar{padding:14px 18px;background:#fff;border-bottom:1px solid #dbe8f6}h1{margin:0;color:#123d72;font-size:clamp(22px,3vw,32px)}p{margin:4px 0 0;color:#63798f}.content{display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);background:#fff;border:1px solid #dbe8f6;border-radius:20px;padding:36px;text-align:center;box-shadow:0 16px 45px rgba(18,61,114,.10)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 24px;border-radius:13px;background:#123d72;color:#fff;text-decoration:none;font-weight:700;font-size:18px;margin-top:22px}.btn:hover{background:#1f67b1}.note{margin-top:14px;font-size:13px;color:#63798f}
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar"><h1>แดชบอร์ดครู</h1><p>ผลการทดสอบการวิเคราะห์รายการค้า</p></header>
    <main class="content">
      <section class="card">
        <h2>เข้าสู่แดชบอร์ดครู</h2>
        <p>กดปุ่มด้านล่างเพื่อเปิดหน้าผลการทดสอบจาก Google Apps Script โดยตรง</p>
        <a class="btn" href="https://script.google.com/macros/s/AKfycbxOgIAYluNrze8GQxtHgCPr8ZDL4ShWNd00-bZIRK4KsRI7FdCVSfE60k6VUxgBIV5f/exec?view=teacher">เปิดแดชบอร์ดครู</a>
        <div class="note">ใช้ ADMIN_KEY ที่ตั้งไว้ใน Script Properties เพื่อเข้าสู่ระบบ</div>
      </section>
    </main>
  </div>
</body>
</html>
