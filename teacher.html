<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123d72">
  <title>แดชบอร์ดครู | แบบทดสอบการวิเคราะห์รายการค้า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: "Sarabun", sans-serif; background: #eef6ff; color: #17324d; overflow: hidden; }
    .page { height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
    .topbar { min-height: 64px; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #fff; border-bottom: 1px solid #dbe8f6; }
    h1 { margin: 0; color: #123d72; font-size: clamp(17px, 2vw, 22px); }
    p { margin: 3px 0 0; color: #63798f; font-size: 13px; }
    a { padding: 10px 14px; border-radius: 10px; background: #123d72; color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
    .app-area { min-height: 0; position: relative; }
    @media (max-width: 640px) { .topbar { min-height: 58px; padding: 8px 12px; } p { display: none; } a { font-size: 13px; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div>
        <h1>แดชบอร์ดครู</h1>
        <p>ผลการทดสอบการวิเคราะห์รายการค้า</p>
      </div>
      <a href="https://script.google.com/macros/s/AKfycbwGK6Y9o1sanqMWWHTs1tRDkMp9g4a30M1FjgO95HzwgCf9OSqI8AXGr8gi-_lT3ARe/exec?view=teacher" target="_blank" rel="noopener">เปิดเต็มหน้าจอ</a>
    </header>
    <main class="app-area">
      <iframe title="แดชบอร์ดครู" src="https://script.google.com/macros/s/AKfycbwGK6Y9o1sanqMWWHTs1tRDkMp9g4a30M1FjgO95HzwgCf9OSqI8AXGr8gi-_lT3ARe/exec?view=teacher" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </main>
  </div>
</body>
</html>
